steps:
  # ── 1. Build and push backend image ────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - 'gcr.io/$PROJECT_ID/urbanguard-backend:$COMMIT_SHA'
      - ./backend
    id: build-backend

  - name: 'gcr.io/cloud-builders/docker'
    args: [push, 'gcr.io/$PROJECT_ID/urbanguard-backend:$COMMIT_SHA']
    id: push-backend
    waitFor: [build-backend]

  # ── 2. Deploy backend to Cloud Run ─────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - urbanguard-backend
      - --image=gcr.io/$PROJECT_ID/urbanguard-backend:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=GEMINI_MODEL=gemini-2.0-flash
      - --set-env-vars=USE_VERTEX_AI=true
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID
      - --set-env-vars=GOOGLE_CLOUD_LOCATION=$_REGION
      - --set-secrets=GEMINI_API_KEY=urbanguard-gemini-key:latest
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5
    id: deploy-backend
    waitFor: [push-backend]

  # ── 3. Build and push frontend image ───────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - 'gcr.io/$PROJECT_ID/urbanguard-frontend:$COMMIT_SHA'
      - --build-arg=NEXT_PUBLIC_API_URL=https://urbanguard-backend-$_SUFFIX.$_REGION.run.app
      - ./frontend
    id: build-frontend
    waitFor: [deploy-backend]

  - name: 'gcr.io/cloud-builders/docker'
    args: [push, 'gcr.io/$PROJECT_ID/urbanguard-frontend:$COMMIT_SHA']
    id: push-frontend
    waitFor: [build-frontend]

  # ── 4. Deploy frontend to Cloud Run ────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - urbanguard-frontend
      - --image=gcr.io/$PROJECT_ID/urbanguard-frontend:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --memory=256Mi
      - --min-instances=0
      - --max-instances=3
    id: deploy-frontend
    waitFor: [push-frontend]

substitutions:
  _REGION: us-central1
  _SUFFIX: ''   # set to the Cloud Run URL hash after first deploy

options:
  logging: CLOUD_LOGGING_ONLY
